<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struk Manual</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #eef0f3; color: #222; }
  .wrap { display: flex; gap: 20px; padding: 16px; align-items: flex-start; }
  .panel { background: #fff; border-radius: 12px; padding: 14px; width: 460px; flex-shrink: 0; }
  .panel h2 { margin: 0 0 8px; font-size: 18px; }
  .kembali { font-size: 13px; color: #1a56c4; text-decoration: none; display: inline-block; margin-bottom: 6px; }
  .blok { border: 1px solid #e6e8eb; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .blok > summary, .judul { font-weight: 600; font-size: 14px; cursor: pointer; }
  .judul { cursor: default; margin-bottom: 4px; }
  label { display: block; font-size: 12px; margin: 7px 0 2px; color: #555; }
  input, select, textarea { width: 100%; padding: 7px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; background: #fff; }
  textarea { min-height: 46px; resize: vertical; }
  input[type=checkbox] { width: auto; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; min-width: 0; }
  .btn { padding: 8px 12px; border: 0; border-radius: 7px; cursor: pointer; font-size: 13px; background: #e8eaed; color: #222; }
  .btn.biru { background: #1a73e8; color: #fff; }
  .btn.hapus { background: #fde8e8; color: #c00; }
  .fbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .pilih { display: flex; gap: 8px; }
  .pilih .opt { flex: 1; padding: 9px; border: 2px solid #ccc; background: #fff; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .pilih .opt.on { border-color: #1a73e8; background: #e8f0fe; color: #1a56c4; }
  .ket { font-size: 12px; color: #777; line-height: 1.45; }
  .ok { font-size: 12px; color: #0b8043; }
  .stat { display: flex; align-items: center; gap: 6px; font-weight: 600; margin: 6px 0; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; flex-shrink: 0; }
  .dot.on { background: #34a853; } .dot.busy { background: #f9ab00; }
  .catatan { font-size: 12px; color: #a15c00; background: #fff6e0; border-radius: 6px; padding: 6px 8px; margin-top: 8px; line-height: 1.45; }
  .bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
  .bar > div { height: 100%; width: 0; background: #0b8043; }
  .aksi { display: flex; gap: 8px; margin-top: 10px; }
  .aksi .btn { flex: 1; padding: 12px 6px; font-size: 14px; }
  .aksi .cetak { background: #0b8043; color: #fff; flex: 2; }
  .aksi .cetak:disabled { background: #9ccfae; }
  .prev { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; position: sticky; top: 16px; }
  .kertas { background: #fff; padding: 8px 6px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  #pratinjau { display: block; }
  .brg { display: grid; grid-template-columns: 1fr 52px 92px 30px; gap: 4px; margin-bottom: 4px; align-items: center; }
  .brg .btn { padding: 7px 0; }
  details summary { cursor: pointer; }
  @media (max-width: 820px) {
    .wrap { flex-direction: column; padding: 8px; gap: 10px; }
    .panel { width: 100%; }
    .prev { position: static; width: 100%; }
    input, select, textarea { font-size: 16px; }
  }

  .addbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 4px; }
  .addbar .btn { background: #e8f0fe; color: #1a56c4; font-size: 12px; padding: 9px 4px; }
  .el { border: 1px solid #dde1e6; border-radius: 8px; margin-bottom: 6px; background: #fafbfc; }
  .el.aktif { border-color: #1a73e8; }
  .elh { display: flex; align-items: center; gap: 4px; padding: 6px 8px; cursor: pointer; }
  .elh .nm { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .elh .nm small { font-weight: 400; color: #888; }
  .elh .btn { padding: 4px 8px; font-size: 12px; background: #fff; border: 1px solid #ddd; }
  .elb { padding: 0 10px 10px; border-top: 1px solid #eee; }
  .rowtbl { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .rowtbl td { padding: 2px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; margin: 8px 0 2px; color: #333; }
  .kosong { text-align: center; color: #888; font-size: 13px; padding: 18px; border: 2px dashed #ddd; border-radius: 8px; }
</style>
</head>

  </div>

      <button type="button" class="btn" onclick="tambah('spasi')">Baris kosong</button>
      <button type="button" class="btn" onclick="tambah('nomor')">Nomor otomatis</button>
      <button type="button" class="btn" onclick="tambah('ttd')">Tanda tangan</button>
    </div>
  </div>

  <div id="daftar"></div>
</div>

<div class="prev">
  <div class="ket">Pratinjau = hasil cetak printer</div>
  <div class="kertas"><canvas id="pratinjau"></canvas></div>
  <div class="ket" id="infoKertas"></div>
  <div class="panel" style="width:100%;max-width:460px;padding:12px">
    <div class="blok" style="margin:0">
      <div class="judul">Printer</div>
      <div class="stat"><span class="dot" id="pDot"></span><span id="pStat">Printer belum terhubung</span></div>
      <div class="fbar" style="margin-top:0">
        <button type="button" class="btn biru" onclick="hubungBT()">🔵 Hubungkan Bluetooth</button>
        <button type="button" class="btn" id="btnSerial" onclick="hubungSerial()">🔌 Serial / COM</button>
        <button type="button" class="btn" onclick="putuskan()">Putuskan</button>
      </div>
      <div class="row">
        <div><label>Huruf printer</label><select id="pFont"><option value="A">Font A – normal</option><option value="B">Font B – kecil</option></select></div>
        <div><label>Jumlah cetak</label><select id="salinan"><option>1</option><option>2</option><option>3</option></select></div>
      </div>
      <details style="margin-top:8px">
        <summary class="ket">Pengaturan lain</summary>
        <div class="row">
          <div><label>Kertas maju setelah cetak</label>
            <select id="pFeed"><option value="1">1 baris</option><option value="3" selected>3 baris</option><option value="5">5 baris</option></select></div>

var QRMode = req('./QRMode');

function QR8bitByte(data) {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {

			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
defs["./QRBitBuffer"] = function(module, exports, req){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

defs["./QRMath"] = function(module, exports, req){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;

defs["./QRPolynomial"] = function(module, exports, req){
var QRMath = req('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

const EAN_P = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];

  const d = txt.replace(/\D/g,"");
  if (d.length < 12 || d.length > 13) throw new Error("EAN-13 butuh 12 atau 13 angka");
  const full = d.slice(0,12) + eanCheck(d.slice(0,12));
  // modules: array of {w, bar, guard}
  const m = []; const push = (ws, startBar, guard) => { let b = startBar; for (const w of ws) { m.push({w:+w, bar:b, guard}); b = !b; } };

/* ---------- susun teks selebar N karakter ---------- */
function bungkus(t, w) {
  const out = [];
  String(t ?? "").split("\n").forEach(par => {
    let b = "";
    par.split(/\s+/).filter(Boolean).forEach(k => {
      while (k.length > w) { if (b) { out.push(b); b = ""; } out.push(k.slice(0, w)); k = k.slice(w); }
      if (!k) return;
      if (!b) b = k; else if (b.length + 1 + k.length <= w) b += " " + k; else { out.push(b); b = k; }
    });
    out.push(b);
  });
  return out;
}
function rataTeks(t, w, r) {
  return bungkus(t, w).map(l => r === "center" ? ulang(" ", Math.floor((w - l.length) / 2)) + l : r === "right" ? ulang(" ", w - l.length) + l : l);
}
function kiriKanan(a, b, w) {
  a = String(a ?? ""); b = String(b ?? "");
  const ls = a ? bungkus(a, w) : [""];
  const akhir = ls.pop();
  if (akhir.length + 1 + b.length <= w) ls.push(akhir + ulang(" ", w - akhir.length - b.length) + b);
  else { if (akhir) ls.push(akhir); ls.push(ulang(" ", Math.max(0, w - b.length)) + b); }
  return ls;
}

const DOTS = { "58": 384, "80": 576 };

/* ---------- gambar (logo, QR, barcode) → bitmap selebar printer ---------- */
function bitmap(dots, h) { const wB = dots / 8; return { dots, wB, h, bits: new Uint8Array(wB * h) }; }
function titik(bm, x, y) { if (x >= 0 && x < bm.dots && y >= 0 && y < bm.h) bm.bits[y * bm.wB + (x >> 3)] |= 0x80 >> (x & 7); }
function kotak(bm, x, y, w, h) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) titik(bm, x + i, y + j); }
function geser(rata, lebar, dots) { return rata === "center" ? Math.floor((dots - lebar) / 2) : rata === "right" ? dots - lebar : 0; }
const muatGambar = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Gambar tidak bisa dibuka")); i.src = src; });
async function rasterGambar(src, pct, rata, ambang, dots) {
  const img = await muatGambar(src);
  const w = Math.max(8, Math.min(dots, Math.round(dots * pct / 100))), h = Math.max(1, Math.round(img.height * w / img.width));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  const p = x.getImageData(0, 0, w, h).data, bm = bitmap(dots, h), x0 = geser(rata, w, dots);
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const i = (yy * w + xx) * 4, a = p[i + 3] / 255;
    if ((0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) * a + 255 * (1 - a) < ambang) titik(bm, x0 + xx, yy);
  }
  return bm;
}
/* logo: hitam-putih lalu buang tepi putih */
const cacheLogo = {};
function siapkanLogo(src, ambang, potong) {
  const key = src.length + ":" + src.slice(-50) + ":" + ambang + ":" + potong;
  if (cacheLogo[key]) return Promise.resolve(cacheLogo[key]);
  return muatGambar(src).then(img => {
    const s = Math.min(1, 576 / img.width);
    const W = Math.max(1, Math.round(img.width * s)), H = Math.max(1, Math.round(img.height * s));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0, W, H);
    const d = x.getImageData(0, 0, W, H), p = d.data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
      const i = (yy * W + xx) * 4, hit = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) < ambang;
      p[i] = p[i + 1] = p[i + 2] = hit ? 0 : 255; p[i + 3] = 255;
      if (hit) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
    }
    x.putImageData(d, 0, 0);
    if (!potong || x1 < 0) return (cacheLogo[key] = c.toDataURL("image/png"));
    const o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
    o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
    return (cacheLogo[key] = o.toDataURL("image/png"));
  }).catch(() => src);
}

/* ---------- dokumen struk ----------
   Isi: string (satu baris teks, sudah selebar N karakter) | {raster: bitmap} | {feed: titik} */
function asciiAman(s) {
  return String(s).replace(/[×✕]/g, "x").replace(/[–—]/g, "-").replace(/[·•]/g, ".").replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
    .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\x20-\x7E]/g, "?");
}
/* → perintah ESC/POS (huruf bawaan printer, tanpa tebal/ukuran khusus) */
function dokumenKeEscPos(dok, o) {
  const fontB = !!o.fontB, sel = SEL(fontB), b = [];
  const raw = (...x) => { for (const v of x) b.push(v & 255); };
  const ESC = 0x1B, GS = 0x1D;
  for (let s = 0; s < (o.salinan || 1); s++) {
    raw(ESC, 0x40, ESC, 0x4D, fontB ? 1 : 0, ESC, 0x33, sel.lh);
    for (const it of dok) {
      if (typeof it === "string") { raw(ESC, 0x61, 0); for (const ch of asciiAman(it.replace(/\s+$/, ""))) b.push(ch.charCodeAt(0)); raw(0x0A); }
      else if (it.raster) {
        const { bits, wB, h } = it.raster; raw(ESC, 0x61, 0);
        for (let y = 0; y < h; y += 96) { const n = Math.min(96, h - y); raw(GS, 0x76, 0x30, 0, wB & 255, wB >> 8, n & 255, n >> 8); for (let k = y * wB; k < (y + n) * wB; k++) b.push(bits[k]); }
      }
      else if (it.feed) { let n = Math.round(it.feed); while (n > 0) { const k = Math.min(255, n); raw(ESC, 0x4A, k); n -= k; } }
    }
    raw(ESC, 0x64, o.feedBaris ?? 3);
    if (o.potong) raw(GS, 0x56, 0x42, 0);
  }
  return new Uint8Array(b);
}
/* → gambar kanvas yang meniru hasil printer (untuk pratinjau, PNG, PDF) */
function dokumenKeKanvas(dok, o) {
  const dots = o.dots, sel = SEL(!!o.fontB);
  let H = 12;
  dok.forEach(it => { H += typeof it === "string" ? sel.lh : it.raster ? it.raster.h : it.feed || 0; });
  H += sel.lh * 2;
  const c = document.createElement("canvas"); c.width = dots; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, dots, H); x.fillStyle = "#000";
  x.font = `${Math.round(sel.h * 0.92)}px "Courier New", Courier, monospace`; x.textBaseline = "alphabetic";
  let y = 8;
  for (const it of dok) {
    if (typeof it === "string") {
      const t = asciiAman(it);
      for (let i = 0; i < t.length; i++) if (t[i] !== " ") x.fillText(t[i], i * sel.w, y + sel.h * 0.8, sel.w + 0.5);
      y += sel.lh;
    } else if (it.raster) {
      const { bits, wB, h } = it.raster, d = x.getImageData(0, y, dots, h), p = d.data;
      for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < dots; xx++) if (bits[yy * wB + (xx >> 3)] & (0x80 >> (xx & 7))) { const k = (yy * dots + xx) * 4; p[k] = p[k + 1] = p[k + 2] = 0; }
      x.putImageData(d, 0, y); y += h;
    } else if (it.feed) y += it.feed;
  }
  return c;
}

/* ---------- simpan file ---------- */
function unduh(blob, nama) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function simpanPNG(c, nama) { c.toBlob(b => unduh(b, nama), "image/png"); }
function simpanPDF(c, nama, lebarMm) {
  const jpg = atob(c.toDataURL("image/jpeg", 0.95).split(",")[1]);
  const W = lebarMm * 72 / 25.4, H = W * c.height / c.width;
  const isi = `q ${W.toFixed(2)} 0 0 ${H.toFixed(2)} 0 0 cm /Im0 Do Q`;
  const obj = ["<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W.toFixed(2)} ${H.toFixed(2)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`,
    null, `<< /Length ${isi.length} >>\nstream\n${isi}\nendstream`];
  let pdf = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const off = [];
  obj.forEach((o, i) => {
    off.push(pdf.length);
    pdf += o === null
      ? `${i + 1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n${jpg}\nendstream\nendobj\n`
      : `${i + 1} 0 obj\n${o}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${obj.length + 1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("") +
    `trailer\n<< /Size ${obj.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
  unduh(new Blob([bytes], { type: "application/pdf" }), nama);
}

const LAYANAN_BLE = [
  "000018f0-0000-1000-8000-00805f9b34fb", "e7810a71-73ae-499d-8c15-faa9aef0c3f2",

async function hubungBT() {
  info("");
  if (!navigator.bluetooth) {
    info("Browser ini belum bisa terhubung langsung ke Bluetooth. Gunakan <b>Google Chrome</b> (Android, Windows, Mac) atau <b>Microsoft Edge</b>. " +
      "Di iPhone/iPad, buka file ini dengan aplikasi browser <b>Bluefy</b>." + (window.isSecureContext ? "" : "<br>Halaman juga harus dibuka dari alamat <b>https://</b>."));
    return;
  }
  try {
    statusPrinter("Mencari printer…", "busy");
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: LAYANAN_BLE });
    await sambungBLE(dev);
  } catch (e) {
    statusPrinter(P.jenis ? `Terhubung: ${P.nama}` : "Printer belum terhubung", P.jenis ? "on" : "");
    if (e.name !== "NotFoundError") info("Gagal terhubung: " + esc(e.message) +
      "<br>Pastikan printer menyala, Bluetooth &amp; Lokasi HP aktif, dan printer tidak sedang tersambung ke aplikasi lain.");
  }

async function sambungBLE(dev) {
  statusPrinter("Menyambungkan ke " + (dev.name || "printer") + "…", "busy");
  const server = await dev.gatt.connect();
  let pilih = null;
  for (const sv of await server.getPrimaryServices()) {
    let chars = []; try { chars = await sv.getCharacteristics(); } catch (e) {}
    for (const c of chars) if (c.properties.writeWithoutResponse || c.properties.write)
      if (!pilih || (c.properties.writeWithoutResponse && !pilih.properties.writeWithoutResponse)) pilih = c;
    if (pilih && pilih.properties.writeWithoutResponse) break;
  }
  if (!pilih) {
    dev.gatt.disconnect();
    throw new Error("Printer ini tidak menyediakan jalur Bluetooth LE untuk mencetak. Kemungkinan printer hanya mendukung Bluetooth klasik. Coba tombol Serial / COM di laptop, atau gunakan aplikasi RawBT di Android.");
  }
  dev.addEventListener("gattserverdisconnected", () => { if (P.dev === dev) { P.ch = null; statusPrinter(`Terputus dari ${P.nama} – tekan Cetak Langsung untuk menyambung ulang`, "busy"); $("btnLangsung").disabled = false; } });
  Object.assign(P, { jenis: "ble", nama: dev.name || "Printer Bluetooth", dev, ch: pilih, tanpaRespon: !!pilih.properties.writeWithoutResponse });
  statusPrinter(`Terhubung: ${P.nama}`, "on");
}
async function hubungSerial() {
  info("");

    let port;
    try { port = await navigator.serial.requestPort({ allowedBluetoothServiceClassIds: [SPP] }); }
    catch (e) { if (e.name === "NotFoundError") throw e; port = await navigator.serial.requestPort(); }
    await port.open({ baudRate: 9600 });
    Object.assign(P, { jenis: "serial", nama: "Printer Serial/COM", port, writer: port.writable.getWriter() });
    statusPrinter(`Terhubung: ${P.nama}`, "on");
  } catch (e) {
    if (e.name !== "NotFoundError") info("Gagal membuka port: " + esc(e.message));
    statusPrinter(P.jenis ? `Terhubung: ${P.nama}` : "Printer belum terhubung", P.jenis ? "on" : "");
  }
}
async function putuskan() {
  try { if (P.jenis === "ble" && P.dev?.gatt.connected) P.dev.gatt.disconnect(); } catch (e) {}
  try { if (P.writer) { P.writer.releaseLock(); await P.port.close(); } } catch (e) {}
  Object.assign(P, { jenis: null, nama: "", dev: null, ch: null, port: null, writer: null });
  statusPrinter("Printer belum terhubung");

async function kirim(bytes, onProg) {
  if (P.jenis === "serial") {
    for (let i = 0; i < bytes.length; i += 1024) { await P.writer.write(bytes.slice(i, i + 1024)); onProg(i / bytes.length); }
    return;
  }
  if (!P.dev.gatt.connected || !P.ch) await sambungBLE(P.dev);
  const size = +$("pChunk").value, jeda = 8;
  for (let i = 0; i < bytes.length; i += size) {
    const part = bytes.slice(i, i + size);
    for (let coba = 0; ; coba++) {
      try {
        if (P.tanpaRespon && P.ch.writeValueWithoutResponse) await P.ch.writeValueWithoutResponse(part);
        else if (P.ch.writeValueWithResponse) await P.ch.writeValueWithResponse(part);
        else await P.ch.writeValue(part);
        break;
      } catch (e) { if (coba >= 5) throw e; await tidur(60); }
    }
    await tidur(size >= 180 ? jeda * 2 : jeda);
    if ((i / size) % 10 === 0) onProg(i / bytes.length);
  }
}

function eksporDesain() { unduh(new Blob([JSON.stringify({ app: "struk-manual", v: 2, G, blocks })], { type: "application/json" }), "desain-struk.json"); }
$("fileDesain").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.blocks)) throw 0; pasang(d); aktif = null; semua(); } catch (err) { alert("File tidak bisa dibuka"); } e.target.value = ""; };
  r.readAsText(f);
});
function kosongkan() { if (blocks.length && !confirm("Hapus semua elemen struk?")) return; blocks = []; aktif = null; semua(); }
function muatContoh() {
  if (blocks.length && !confirm("Ganti struk sekarang dengan contoh?")) return;
  const B = (type, p = {}) => ({ id: uid(), type, ...BARU[type](), ...p });
  blocks = [
    B("teks", { isi: "TOKO MAJU JAYA" }), B("teks", { isi: "Jl. Merdeka No. 10, Jakarta\nTelp. 0812-3456-7890" }),
    B("garis"), B("nomor"), B("tanggal"), B("kolom", { kiri: "Kasir", kanan: "Admin" }), B("garis"),
    B("barang", { rows: [{ nama: "Kopi Susu Gula Aren", qty: 2, harga: 18000 }, { nama: "Roti Bakar Coklat", qty: 1, harga: 15000 }, { nama: "Air Mineral 600ml", qty: 3, harga: 5000 }] }),
    B("garis"), B("total", { bayar: 100000 }), B("garis"), B("teks", { isi: "Terima kasih atas kunjungan Anda" })
  ];
  aktif = null; semua();
}

/* ===== MULAI ===== */
if (!navigator.serial) $("btnSerial").style.display = "none";
let adaData = false;
try { const d = JSON.parse(localStorage.getItem(KUNCI)); if (d && d.blocks) { pasang(d); adaData = true; } } catch (e) {}
if (!adaData) muatContoh();
const uq = new URLSearchParams(location.search).get("ukuran"); if (uq === "58" || uq === "80") G.ukuran = uq;
siap = true;
semua();
</script>
